<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .flex-container{
            display:flex;
            gap: 20px;
            background-color: rgba(0, 255, 255, 0.974);
            padding: 20px;
        }
        .flex-item{
            background-color: aquamarine;
            color: aliceblue;
            padding: 20px;
            text-align: center;
            flex:1;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
       <div class="flex container">
        <div class="flex item"> flex box item 1</div>
        <div class="flex item"> flex box item 2</div>
        <div class="flex item"> flex box item 3</div>
        <div class="flex item"> flex box item 4</div>
        <div class="flex item"> flex box item 5</div>
        </div>
</body>
</html>
